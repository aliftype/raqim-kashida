name: Pages

on:
  push:
    branches: [wasm]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build --target web --out-dir demo/pkg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v5
