[package]
name = "raqim-kashida"
version = "0.2.5"
edition = "2021"
rust-version = "1.82"
description = "Finding kashida (tatweel) insertion points and priorities, driven by a small pattern language."
license = "MIT"
repository = "https://github.com/aliftype/raqim-kashida"
readme = "README.md"
keywords = ["arabic", "kashida", "tatweel", "justification", "typesetting"]
categories = ["text-processing", "internationalization"]
include = ["/src/**/*", "/examples/*.rs", "/data/*.pat", "/README.md", "/LICENSE"]

[lib]
name = "kashida"
crate-type = ["cdylib", "rlib"]

[dependencies]
icu_properties = { version = "2.2", features = ["compiled_data"] }
icu_segmenter = { version = "2.2", features = ["compiled_data"] }

# The WASM binding, compiled only for the browser wasm target.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.118"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
